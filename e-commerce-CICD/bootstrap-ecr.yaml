AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstrap stack - ECR repositories for the 3 backend services.
  Deploy this FIRST, push your images, then deploy main-stack.yaml.

Parameters:
  ServicePrefix:
    Type: String
    Default: demo

Resources:
  OrdersRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ServicePrefix}/orders'
      EmptyOnDelete: true   # lets `aws cloudformation delete-stack` succeed even with images inside

  UsersRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ServicePrefix}/users'
      EmptyOnDelete: true

  ProductsRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ServicePrefix}/products'
      EmptyOnDelete: true

Outputs:
  OrdersRepoUri:
    Value: !GetAtt OrdersRepo.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-OrdersRepoUri'
  UsersRepoUri:
    Value: !GetAtt UsersRepo.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-UsersRepoUri'
  ProductsRepoUri:
    Value: !GetAtt ProductsRepo.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-ProductsRepoUri'