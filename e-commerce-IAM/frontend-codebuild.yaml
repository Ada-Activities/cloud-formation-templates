AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Builds the React/TS frontend from GitHub and manually deploys the built assets to
  Amplify Hosting via the create-deployment / start-deployment APIs. Avoids Amplify's
  direct GitHub App connection entirely - sidesteps the OAuth handshake issues that
  happen when connecting via CloudFormation/CLI instead of the console.
  PREREQUISITE: same one-time `aws codebuild import-source-credentials` step used for
  the backend builds (see codebuild-projects.yaml) must already be done.

Parameters:
  FrontendRepoUrl:
    Type: String
    Description: e.g. https://github.com/Ada-Activities/Ada-E-Commerce-FE
  GitHubBranch:
    Type: String
    Default: main
  AmplifyAppId:
    Type: String
    Description: Output from main-stack.yaml (AmplifyAppId)
  AmplifyBranchName:
    Type: String
    Description: Output from main-stack.yaml (AmplifyBranchName)
  ApiBaseUrl:
    Type: String
    Description: Output from main-stack.yaml (ApiHttpsUrl) - the CloudFront/ALB endpoint
  PresignApiUrl:
    Type: String
    Description: Output from main-stack.yaml (PresignApiUrl)
  BuildOutputDir:
    Type: String
    Default: build
    Description: Use 'build' for Create React App, 'dist' for Vite

Resources:
  FrontendBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildAndDeployToAmplify
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                  - amplify:GetApp
                  - amplify:GetBranch
                Resource: '*'

  FrontendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-frontend-build'
      ServiceRole: !GetAtt FrontendBuildRole.Arn
      Artifacts: { Type: NO_ARTIFACTS }
      Source:
        Type: GITHUB
        Location: !Ref FrontendRepoUrl
        BuildSpec: !Sub |
          version: 0.2
          env:
            variables:
              VITE_USER_URL: '${ApiBaseUrl}'
              VITE_PRODUCT_URL: '${ApiBaseUrl}'
              VITE_ORDER_URL: '${ApiBaseUrl}'
              VITE_LAMBDA_URL: '${PresignApiUrl}'
          phases:
            install:
              runtime-versions:
                nodejs: 20
              commands:
                - npm install
            build:
              commands:
                - npm run build
            post_build:
              commands:
                - cd ${BuildOutputDir} && zip -r ../build.zip . && cd ..
                - |
                  RESPONSE=$(aws amplify create-deployment --app-id ${AmplifyAppId} --branch-name ${AmplifyBranchName})
                  ZIP_URL=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['zipUploadUrl'])")
                  JOB_ID=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['jobId'])")
                  curl -T build.zip "$ZIP_URL"
                  aws amplify start-deployment --app-id ${AmplifyAppId} --branch-name ${AmplifyBranchName} --job-id $JOB_ID
      SourceVersion: !Ref GitHubBranch
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: AWS_REGION, Value: !Ref AWS::Region }
      TimeoutInMinutes: 20

Outputs:
  FrontendProjectName:
    Value: !Ref FrontendBuildProject